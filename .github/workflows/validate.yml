name: validate

# 用**真实** sing-box 内核校验脚本生成的配置。
# 之前一连串 bug（hysteria2 masquerade 格式、naive network 取值等）都是
# schema 错误，本地桩程序拦不住，只有真内核跑 `sing-box check` 才能发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 语法检查
        run: bash -n sbbox.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # SC2086(未加引号的变量展开) 等风格项在本脚本里大量属于有意为之，
          # 只让真正会导致运行期错误的问题使 CI 失败。
          shellcheck -S error sbbox.sh

  config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 全部五协议
            env: tup=1 hyp=1 nvp=1 vlp=1 alns=1
          - name: 仅 Reality
            env: vlp=1
          - name: 仅 Hysteria2
            env: hyp=1
          - name: 仅 Tuic
            env: tup=1
          - name: 自签证书组合
            env: tup=1 hyp=1 vlp=1
          - name: Hysteria2 跳跃端口
            env: hyp=1 hyjpt=20000
          - name: Hysteria2 混淆+Brutal
            env: hyp=1 tup=1 hyup=200 hydown=1000
          - name: Hysteria2 关闭混淆
            env: hyp=1 hyobfs=0
          - name: Tuic 原生 UDP
            env: tup=1 tuicuos=0
          - name: Tuic 关闭 TLS 加固
            env: tup=1 alns=1 tuils=0
    name: 配置校验 - ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装真实 sing-box 内核
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest \
                | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "sing-box 版本: $VER"
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp "sing-box-${VER}-linux-amd64/sing-box" "sing-box-${VER}-linux-amd64/libcronet.so"
          sudo install -m755 /tmp/sing-box /usr/local/bin/sing-box
          sudo install -m644 /tmp/libcronet.so /usr/local/bin/libcronet.so
          sing-box version

      - name: 预置内核与证书
        run: |
          set -euo pipefail
          mkdir -p "$HOME/sbbox/cert"
          # 脚本会优先复用已存在的内核，省去下载
          install -m755 /usr/local/bin/sing-box "$HOME/sbbox/sing-box"
          install -m644 /usr/local/bin/libcronet.so "$HOME/sbbox/libcronet.so"
          # 预置证书让 alns=1 路径跳过 ACME 签发，从而覆盖到 naive 入站
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$HOME/sbbox/cert/private.key" \
            -out "$HOME/sbbox/cert/fullchain.cer" \
            -subj "/CN=ci.example.com" 2>/dev/null

      - name: 生成配置并用真实内核校验
        run: |
          set -euo pipefail
          env SBBOX_CHECK_ONLY=1 ${{ matrix.env }} bash sbbox.sh

      - name: 断言启用的协议确实出现在配置中
        run: |
          set -euo pipefail
          CONF="$HOME/sbbox/sb.json"
          echo "--- 生成的入站 ---"
          jq -r '.inbounds[].type' "$CONF"
          for want in ${{ matrix.env }}; do
            case "$want" in
              tup=1) jq -e '.inbounds[]|select(.type=="tuic")'      "$CONF" >/dev/null ;;
              hyp=1) jq -e '.inbounds[]|select(.type=="hysteria2")' "$CONF" >/dev/null ;;
              nvp=1) jq -e '.inbounds[]|select(.type=="naive")'     "$CONF" >/dev/null ;;
              vlp=1) jq -e '.inbounds[]|select(.type=="vless")'     "$CONF" >/dev/null ;;
            esac
          done
          echo "OK: 所有启用的协议均已生成"

      - name: 断言 Hysteria2 拥塞控制与混淆互斥关系正确
        run: |
          set -euo pipefail
          CONF="$HOME/sbbox/sb.json"
          jq -e '.inbounds[]|select(.type=="hysteria2")' "$CONF" >/dev/null 2>&1 || exit 0
          HY=$(jq -c '.inbounds[]|select(.type=="hysteria2")' "$CONF")
          echo "hysteria2 入站: $HY"
          if echo '${{ matrix.env }}' | grep -q 'hyup='; then
            # 设了带宽 → 必须走 Brutal，且不能同时出现 ignore_client_bandwidth
            echo "$HY" | jq -e '.up_mbps and .down_mbps' >/dev/null || { echo "缺少带宽上限"; exit 1; }
            echo "$HY" | jq -e 'has("ignore_client_bandwidth")|not' >/dev/null \
              || { echo "带宽上限与 ignore_client_bandwidth 互斥，不能并存"; exit 1; }
          else
            echo "$HY" | jq -e '.ignore_client_bandwidth==true' >/dev/null \
              || { echo "默认应 ignore_client_bandwidth=true 走 BBR"; exit 1; }
          fi
          # 混淆默认开启，只有显式 hyobfs=0 才应缺失
          if echo '${{ matrix.env }}' | grep -q 'hyobfs=0'; then
            echo "$HY" | jq -e 'has("obfs")|not' >/dev/null \
              || { echo "hyobfs=0 应关闭 obfs"; exit 1; }
          else
            echo "$HY" | jq -e '.obfs.type=="salamander" and (.obfs.password|length>0)' >/dev/null \
              || { echo "默认应启用 salamander obfs"; exit 1; }
          fi
          echo "OK: Hysteria2 拥塞控制/混淆配置符合预期"

      - name: 校验客户端配置（sing-box check）
        run: |
          set -euo pipefail
          CLIENT="$HOME/sbbox/sbox_client.json"
          jq -e . "$CLIENT" >/dev/null
          # 在二进制目录内执行，naive 出站才能 dlopen 到同目录的 libcronet.so
          (cd /usr/local/bin && ./sing-box check -c "$CLIENT")
          echo "OK: 客户端配置通过真实内核校验"

      - name: 断言 naive H2/H3 出站开启 UDP-over-TCP 与拥塞控制
        run: |
          set -euo pipefail
          if ! echo '${{ matrix.env }}' | grep -q 'nvp=1'; then exit 0; fi
          CLIENT="$HOME/sbbox/sbox_client.json"
          # H2 出站 + H3(QUIC) 出站都要在，且都开启 udp_over_tcp 与拥塞控制
          jq -e '.outbounds[]|select(.tag=="naive")|.udp_over_tcp==true' "$CLIENT" >/dev/null             || { echo "naive H2 出站应开 udp_over_tcp"; exit 1; }
          jq -e '.outbounds[]|select(.tag=="naive-h3")|.quic==true and .quic_congestion_control=="bbr" and .udp_over_tcp==true' "$CLIENT" >/dev/null             || { echo "naive H3 出站应 quic=true + cc=bbr + udp_over_tcp"; exit 1; }
          echo "OK: naive H2/H3 出站 UDP-over-TCP 与拥塞控制均开启"
          # 分享链接要带 uot=1（v2rayN NaiveFmt 解析）和 congestion_control=bbr
          grep -c 'uot=1' "$HOME/sbbox/nodes.txt" | grep -qx '4'             || { echo "4 条 naive 链接都应带 uot=1（UDP over TCP）"; exit 1; }
          # 固定证书：pcs= 应为 64 位 hex 指纹（naive 4 条必带，tuic 全协议时也带，故 >=4）
          PCS=$(grep -c 'pcs=[0-9a-fA-F]\{64\}' "$HOME/sbbox/nodes.txt" || true)
          [ "$PCS" -ge 4 ] || { echo "naive 链接应带证书 SHA-256 指纹 pcs="; exit 1; }
          echo "OK: 分享链接已带 uot=1、拥塞控制与证书指纹参数"

      - name: 断言 Tuic TLS 加固（utls + 公钥固定）
        run: |
          set -euo pipefail
          if ! echo '${{ matrix.env }}' | grep -q 'tup=1'; then exit 0; fi
          CLIENT="$HOME/sbbox/sbox_client.json"
          T=$(jq -c '.outbounds[]|select(.type=="tuic")' "$CLIENT")
          if echo '${{ matrix.env }}' | grep -q 'tuils=0'; then
            echo "$T" | jq -e '.tls.utls==null and (.tls.certificate_public_key_sha256==null)' >/dev/null               || { echo "tuils=0 应移除 utls 与公钥固定"; exit 1; }
          else
            # 有真实证书时（alns=1 且 CI 预置了证书）应生成 chrome 指纹 + 非空公钥固定
            echo "$T" | jq -e '.tls.utls.fingerprint=="chrome"' >/dev/null               || { echo "默认应启用 uTLS chrome 指纹"; exit 1; }
            echo "$T" | jq -e '.tls.certificate_public_key_sha256 | length>0' >/dev/null               || { echo "有真实证书时默认应固定证书公钥 SHA-256"; exit 1; }
          fi
          echo "OK: Tuic TLS 加固符合预期"

      - name: 断言客户端嗅探与 Tuic UDP 模式互斥
        run: |
          set -euo pipefail
          CLIENT="$HOME/sbbox/sbox_client.json"
          # 没有 sniff，按域名匹配的 geosite-cn 直连规则对纯 IP 连接会失效
          jq -e '.route.rules[0].action=="sniff"' "$CLIENT" >/dev/null             || { echo "客户端路由首条应为 sniff 动作"; exit 1; }
          if jq -e '.outbounds[]|select(.type=="tuic")' "$CLIENT" >/dev/null 2>&1; then
            T=$(jq -c '.outbounds[]|select(.type=="tuic")' "$CLIENT")
            echo "tuic 出站: $T"
            # 官方文档：udp_over_stream 与 udp_relay_mode 互斥，不可并存
            echo "$T" | jq -e '(has("udp_over_stream") and (has("udp_relay_mode")|not)) or (has("udp_relay_mode") and (has("udp_over_stream")|not))' >/dev/null               || { echo "udp_over_stream 与 udp_relay_mode 互斥，只能出现其一"; exit 1; }
          fi
          echo "OK: 嗅探已启用，Tuic UDP 模式互斥正确"

      - name: 断言 Tuic 分享链接带 Fingerprint 与证书固定
        run: |
          set -euo pipefail
          if ! echo '${{ matrix.env }}' | grep -q 'tup=1'; then exit 0; fi
          LINK=$(grep '^tuic://' "$HOME/sbbox/nodes.txt" | head -1)
          # 指纹参数：fp=chrome + 64 位 hex pcs（真实证书场景 alns=1 才有）
          echo "$LINK" | grep -q 'fp=chrome' || { echo "tuic 链接应带 fp=chrome"; exit 1; }
          if echo '${{ matrix.env }}' | grep -q 'alns=1'; then
            echo "$LINK" | grep -qE 'pcs=[0-9a-fA-F]{64}' || { echo "有证书时 tuic 链接应带 pcs 指纹"; exit 1; }
          fi
          echo "OK: Tuic 链接已带 Fingerprint 与证书固定"

      - name: 校验 Clash/Mihomo YAML 与订阅
        run: |
          set -euo pipefail
          python3 -c "import yaml; yaml.safe_load(open('$HOME/sbbox/clmi.yaml')); print('OK: clmi.yaml 是合法 YAML')"

  subscription:
    runs-on: ubuntu-latest
    name: 订阅格式校验
    steps:
      - uses: actions/checkout@v4
      - name: 安装真实 sing-box 内核
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest \
                | grep -oP '"tag_name":\s*"v\K[^"]+')
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp "sing-box-${VER}-linux-amd64/sing-box" "sing-box-${VER}-linux-amd64/libcronet.so"
          mkdir -p "$HOME/sbbox"
          install -m755 /tmp/sing-box "$HOME/sbbox/sing-box"
          sudo install -m755 /tmp/sing-box /usr/local/bin/sing-box

      - name: 预置证书（覆盖 naive，用于验证订阅剔除逻辑）
        run: |
          mkdir -p "$HOME/sbbox/cert"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$HOME/sbbox/cert/private.key" \
            -out "$HOME/sbbox/cert/fullchain.cer" \
            -subj "/CN=ci.example.com" 2>/dev/null

      - name: 生成配置
        run: env SBBOX_CHECK_ONLY=1 tup=1 hyp=1 nvp=1 vlp=1 alns=1 bash sbbox.sh

      - name: 生成节点与订阅
        run: env sub=1 subport=18080 bash sbbox.sh list

      - name: 断言订阅是合法 base64 且包含全部节点（含 naive）
        run: |
          set -euo pipefail
          TOKEN=$(cat "$HOME/sbbox/subtoken")
          SUB="$HOME/sbbox/websub/$TOKEN"
          test -s "$SUB" || { echo "订阅文件为空"; exit 1; }
          # v2rayN 要求单行 base64，不能含换行。
          # 无尾换行的单行文件 wc -l 记为 0 行；用 grep 找 \n 不可行（模式里的
          # 换行会被当成「空模式或空模式」，匹配任意行，永远为真）。
          [ "$(wc -l < "$SUB")" -eq 0 ] || { echo "订阅含换行，v2rayN 无法解析"; exit 1; }
          base64 -d < "$SUB" > /tmp/decoded.txt
          echo "--- 订阅内容 ---"; cat /tmp/decoded.txt
          # naive 两套 scheme 都要在：naive+ 给 v2rayN/NekoBox，http2/3 给 Shadowrocket
          grep -q '^naive+https://' /tmp/decoded.txt || { echo "缺少 naive H2 节点(v2rayN)"; exit 1; }
          grep -q '^naive+quic://'  /tmp/decoded.txt || { echo "缺少 naive H3 节点(v2rayN)"; exit 1; }
          grep -q '^http2://'       /tmp/decoded.txt || { echo "缺少 naive H2 节点(Shadowrocket)"; exit 1; }
          grep -q '^http3://'       /tmp/decoded.txt || { echo "缺少 naive H3 节点(Shadowrocket)"; exit 1; }
          grep -q '^vless://'      /tmp/decoded.txt || { echo "缺少 reality 节点"; exit 1; }
          grep -q '^hysteria2://'  /tmp/decoded.txt || { echo "缺少 hysteria2 节点"; exit 1; }
          grep -q '^tuic://'       /tmp/decoded.txt || { echo "缺少 tuic 节点"; exit 1; }
          echo "OK: 订阅含全部节点，naive 双 scheme 齐备"

      - name: 断言 sub_nonaive=1 时剔除 naive 但仍合法
        run: |
          set -euo pipefail
          env sub=1 subport=18081 sub_nonaive=1 bash sbbox.sh list >/dev/null 2>&1
          TOKEN=$(cat "$HOME/sbbox/subtoken")
          SUB="$HOME/sbbox/websub/$TOKEN"
          base64 -d < "$SUB" > /tmp/decoded2.txt
          echo "--- sub_nonaive 订阅内容 ---"; cat /tmp/decoded2.txt
          grep -qE '^(naive\+|http2://|http3://)' /tmp/decoded2.txt && { echo "sub_nonaive=1 应剔除 naive 的两套 scheme"; exit 1; }
          grep -q '^tuic://' /tmp/decoded2.txt || { echo "剔除 naive 后仍应有其他节点"; exit 1; }
          echo "OK: sub_nonaive=1 生效"

      - name: 断言目录列表不泄露订阅令牌
        run: |
          test -f "$HOME/sbbox/websub/index.html" \
            && echo "OK: index.html 存在，根路径不会列出令牌文件名" \
            || { echo "缺少 index.html，访问根路径会暴露令牌"; exit 1; }
